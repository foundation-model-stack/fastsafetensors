name: Build wheel and sdist

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build-wheels:
    name: Build wheel for ${{ matrix.python-version }} ${{ matrix.platform.arch }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["cp310", "cp311", "cp312", "cp313", "cp314", "cp315"]
        platform:
          - arch: x86_64
            runner: ubuntu-latest
            build: manylinux_x86_64
            cibw_arch: x86_64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            build: manylinux_aarch64
            cibw_arch: aarch64
          - arch: win_amd64
            runner: windows-latest
            build: win_amd64
            cibw_arch: AMD64
            redist_arch: x64
          - arch: win_arm64
            runner: windows-11-arm
            build: win_arm64
            cibw_arch: ARM64
            redist_arch: arm64

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    # The wheel is built with the image's newest MSVC toolset, but the
    # image's installed VC redistributable can lag behind it (14.40 vs 14.51
    # on windows-2025-vs2026), so delvewheel would vendor an msvcp140.dll
    # older than the toolset that built the .pyd. Install the redist that
    # ships inside the image's own Visual Studio, which matches the toolset.
    - name: Update VC++ redistributable to match the MSVC toolset (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $vs = & $vswhere -latest -products * -property installationPath
        if (-not $vs) { throw "Visual Studio installation not found" }
        $redistArch = "${{ matrix.platform.redist_arch }}"
        $redistName = "vc_redist.$redistArch.exe"
        $redist = Get-ChildItem "$vs\VC\Redist\MSVC" -Recurse -Filter $redistName |
          Sort-Object { $_.VersionInfo.FileVersionRaw } | Select-Object -Last 1
        if (-not $redist) { throw "$redistName not found under $vs" }
        Write-Host "Installing $($redist.FullName) ($($redist.VersionInfo.FileVersion))"
        $p = Start-Process -FilePath $redist.FullName -ArgumentList '/install','/quiet','/norestart' -Wait -PassThru
        # 1638: same or newer version already installed; 3010: success, reboot required
        if ($p.ExitCode -notin 0, 1638, 3010) { throw "$redistName exited with $($p.ExitCode)" }

    - name: Install cibuildwheel
      run: python -m pip install "cibuildwheel>=4.2" setuptools pybind11
    - name: Build wheels with cibuildwheel
      run: |
        cibuildwheel --output-dir wheelhouse
      env:
        CIBW_BUILD: "${{ matrix.python-version }}-${{ matrix.platform.build }}"
        CIBW_SKIP: "*-musllinux_* *-win32 *-manylinux_i686"
        CIBW_TEST_COMMAND: "python {project}/tests/smoke_import_cpp.py"
        CIBW_ARCHS: "${{ matrix.platform.cibw_arch }}"
        # Bundle MSVC runtime satellite DLLs into the wheel; Windows runner
        # images can build against a toolchain newer than what end-user
        # machines (and the test env) may have installed.
        CIBW_BEFORE_BUILD_WINDOWS: "pip install delvewheel"
        # --add-path makes delvewheel take msvcp140.dll from System32 (kept
        # current by the redist step above) instead of a stale copy that some
        # other tool ships earlier on PATH.
        CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: "delvewheel repair --add-path C:/Windows/System32 -w {dest_dir} {wheel}"
        # Diagnostic: print the .pyd import table and where each DLL resolves
        # from, so a load failure names the missing DLL instead of Windows'
        # generic "module could not be found".
        CIBW_TEST_REQUIRES_WINDOWS: "pefile"
        CIBW_TEST_COMMAND_WINDOWS: "python {project}/tests/dump_pyd_imports.py && python {project}/tests/smoke_import_cpp.py"

    - name: Upload wheel artifact
      uses: actions/upload-artifact@v4
      with:
        name: wheels-${{ matrix.python-version }}-${{ matrix.platform.arch }}
        path: wheelhouse/*.whl

  build-sdist:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build
        run: pip install build

      - name: Build sdist
        run: python -m build --sdist --outdir dist/

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  upload:
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest

    steps:
    - name: Download all wheels
      uses: actions/download-artifact@v4
      with:
        path: dist
    - name: Download sdist artifact
      uses: actions/download-artifact@v4
      with:
        name: sdist
        path: dist

    - name: Flatten all artifacts
      run: |
        mkdir final_dist
        find dist -name '*.whl' -exec cp {} final_dist/ \;
        find dist -name '*.tar.gz' -exec cp {} final_dist/ \;

    - name: Upload all artifact
      uses: actions/upload-artifact@v4
      with:
        name: final_dist
        path: final_dist

