name: test-torch

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test-torch:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libnuma-dev gcc g++ make
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          tf_ver=5.0.0
          npy_spec="numpy>=2.2,<2.5"
          pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          pip install pytest pytest-cov setuptools_scm safetensors transformers==${tf_ver} "${npy_spec}"
      - name: Build package
        run: |
          pip install .
      - name: Run tests
        run: |
          cd tests/unit
          LIBDIR=`python3 -c "import os; os.chdir('/tmp'); import fastsafetensors; print(os.path.dirname(fastsafetensors.__file__))"`
          mkdir -p /tmp/pytest-log
          export TEST_FASTSAFETENSORS_FRAMEWORK=pytorch
          COVERAGE_FILE=.coverage_unit pytest -s --cov="${LIBDIR}" . --ignore=test_multi.py --ignore=test_subgroup.py --ignore=test_broadcast_runs.py > /tmp/pytest-log/unit.log 2>&1
          COVERAGE_FILE=.coverage_single pytest -s --cov="${LIBDIR}" test_multi.py > /tmp/pytest-log/single.log 2>&1
          export LIBDIR
          torchrun --standalone --nproc_per_node=4 --no-python bash -c 'COVERAGE_FILE=.coverage_dist_$RANK pytest -s --cov="$LIBDIR" test_multi.py test_subgroup.py test_broadcast_runs.py > /tmp/pytest-log/distributed-$RANK.log 2>&1'
          coverage combine .coverage_*
          coverage html
          mv htmlcov /tmp/pytest-log
      - name: Upload Pytest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log-${{ matrix.python-version }}
          path: /tmp/pytest-log

  build-and-test-torch-windows-nogds:
    name: Test Windows nogds smoke (Python 3.13)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"
      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          pip install pytest pytest-cov setuptools_scm safetensors transformers==5.0.0 "numpy>=2.2,<2.5"
          pip install .
      - name: Run tests
        shell: bash
        env:
          TEST_FASTSAFETENSORS_FRAMEWORK: pytorch
        run: |
          LOGDIR="${RUNNER_TEMP}/pytest-log"
          mkdir -p "${LOGDIR}"
          cd tests/unit
          LIBDIR=$(python -c "import os, tempfile; os.chdir(tempfile.gettempdir()); import fastsafetensors; print(os.path.dirname(fastsafetensors.__file__))")
          COVERAGE_FILE=.coverage_0 pytest -s --cov="${LIBDIR}" test_fastsafetensors.py -k "not test_init_gds and not test_close_gds and not test_GdsFileCopier and not test_SafeTensorsFileLoader and not test_SafeTensorsFileLoader_copier_selection and not test_FgdsFileCopier" > "${LOGDIR}/0.log" 2>&1
          COVERAGE_FILE=.coverage_own pytest -s --cov="${LIBDIR}" test_tensor_ownership.py > "${LOGDIR}/tensor_ownership.log" 2>&1
          COVERAGE_FILE=.coverage_borrowed pytest -s --cov="${LIBDIR}" test_borrowed_tensors.py > "${LOGDIR}/borrowed_tensors.log" 2>&1
          COVERAGE_FILE=.coverage_3fs pytest -s --cov="${LIBDIR}" threefs > "${LOGDIR}/threefs.log" 2>&1
          coverage combine .coverage_*
          coverage html -d "${LOGDIR}/htmlcov"
      - name: Upload Pytest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log-windows-3.13-nogds
          path: ${{ runner.temp }}/pytest-log
